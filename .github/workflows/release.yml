name: build-desktop
# Builds single-file executables (no Node needed on the user's machine) on each OS.
# Push a tag like v0.3.0 to also attach them to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm test
      - run: node scripts/build-sea.js
      - name: Smoke test the executable
        shell: bash
        run: |
          EXE=$(ls dist/plainnote-* | head -1)
          "$EXE" --no-window --port 47999 --notes "$RUNNER_TEMP/notes" &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47999/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:47999/ -o "$RUNNER_TEMP/index.html"
          curl -sf http://127.0.0.1:47999/md.js -o "$RUNNER_TEMP/md.js"
          grep -q "Plainnote" "$RUNNER_TEMP/index.html"
          grep -q "wikiContext" "$RUNNER_TEMP/md.js"
          kill $PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: plainnote-${{ matrix.os }}
          path: dist/plainnote-*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: artifacts/* }
