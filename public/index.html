<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plainnote</title>

<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--sep:#0000001a;--hover:#0000000d;--field:#00000010;--elev:0 24px 60px #00000040,0 0 0 .5px #0000002e;--on-acc:#fff;--bg:#fff;--fg:#1d1d1f;--mute:#6e6e73;--line:#e5e5ea;--side:#f6f6f8;--acc:#5b5bd6;--code:#f0f0f3;--str:#2f8f5b;--num:#c2570c;--sel:#5b5bd633;color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{--sep:#ffffff1f;--hover:#ffffff12;--field:#ffffff17;--elev:0 24px 60px #000000a0,0 0 0 .5px #ffffff2e;--bg:#1e1e1e;--fg:#ececf0;--mute:#9a9aa3;--line:#2c2c32;--side:#1f1f24;--acc:#9d9dff;--code:#26262c;--str:#7fd6a0;--num:#ffb070;--sel:#7c7cf055;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--sep:#ffffff1f;--hover:#ffffff12;--field:#ffffff17;--elev:0 24px 60px #000000a0,0 0 0 .5px #ffffff2e;--bg:#1e1e1e;--fg:#ececf0;--mute:#9a9aa3;--line:#2c2c32;--side:#1f1f24;--acc:#9d9dff;--code:#26262c;--str:#7fd6a0;--num:#ffb070;--sel:#7c7cf055}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,system-ui,sans-serif}
#app{display:grid;grid-template-columns:260px 1fr;height:100%}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side header{padding:10px;display:flex;gap:6px}
input,button,textarea{font:inherit;color:inherit}
#q{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
#tags{padding:0 10px 8px;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--mute)}
.chip:hover,.chip.on{border-color:var(--acc);color:var(--acc)}.chip.on{background:var(--acc);color:#fff}
#sf{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
#ss{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pv a.tag{text-decoration:none;background:var(--code);padding:0 6px;border-radius:99px;font-size:.9em}
#list{overflow:auto;flex:1;padding:0 6px 10px}
.item{padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item:hover{background:var(--line)}.item.on{background:var(--acc);color:#fff}
.snip{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.item.on .snip{color:#ffffffcc}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line)}
#title{flex:1;border:0;background:none;font-size:17px;font-weight:600;outline:0}
#status{color:var(--mute);font-size:12px}
#wc{color:var(--mute);font-size:12px;white-space:nowrap}
#pane{flex:1;overflow:auto;min-height:0}
#pv{font-size:calc(var(--fs,14px) + 1px);display:block;width:100%;max-width:760px;margin:0 auto;padding:24px 16px 80px}
#edwrap{position:relative;max-width:760px;margin:0 auto}
#hl,#ed{display:block;margin:0;padding:24px 16px 80px;width:100%;border:0;font:var(--fs,14px)/1.7 ui-monospace,Menlo,monospace;letter-spacing:normal;tab-size:2;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word}
#hl{position:absolute;inset:0;pointer-events:none;overflow:hidden;color:var(--fg)}
#ed{position:relative;resize:none;outline:0;overflow:hidden;background:transparent;color:transparent;caret-color:var(--fg)}
#ed::placeholder{color:var(--mute)}#ed::selection{background:var(--sel);color:transparent}
.mk-h{color:var(--acc);font-weight:700}.mk-m{color:var(--mute)}.mk-q{color:var(--mute);font-style:italic}.mk-b{font-weight:700}.mk-i{font-style:italic}
.mk-c{color:var(--num);background:var(--code);border-radius:3px}.mk-l{color:var(--acc)}.mk-u{color:var(--str)}.mk-t{color:var(--acc);font-weight:600}.mk-x{text-decoration:line-through;color:var(--mute)}.mk-n{color:var(--acc)}
#pv a{color:var(--acc)}#pv a.new{opacity:.6;border-bottom:1px dashed}
#pv code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
#pv pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}#pv pre code{padding:0;background:none}
#pv img{max-width:100%;border-radius:6px}
#pv table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
#pv th,#pv td{border:1px solid var(--line);padding:5px 10px}#pv th{background:var(--code)}
#pv blockquote{margin:0;padding-left:12px;border-left:3px solid var(--line);color:var(--mute)}
#pv hr{border:0;border-top:1px solid var(--line)}
#pv .fm{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}#pv .fm b{text-transform:uppercase;letter-spacing:.04em;font-size:10px;margin-right:4px}
#pv .embed{margin:12px 0;padding:2px 14px;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 6%,transparent);border-radius:0 8px 8px 0}#pv .embed-title{font-size:11px;margin-top:6px}
#swl .tk{margin-right:8px;cursor:pointer}
#pv mark{background:rgba(255,200,0,.35);color:inherit;border-radius:3px;padding:0 2px}
#pv .callout{margin:12px 0;padding:10px 14px;border-radius:8px;border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
#pv .callout-title{font-weight:600;margin-bottom:2px}
#pv .callout-warning,#pv .callout-caution{--acc:#e8870e}#pv .callout-danger,#pv .callout-bug{--acc:#d6453d}#pv .callout-tip,#pv .callout-success{--acc:#2f9e5b}
#pv .footnotes{font-size:.9em;color:var(--mute)}#pv sup.fn a{text-decoration:none}
#back .um{display:block;margin-top:6px}#back .um a{margin-right:6px}#back .um b{font-weight:600}
#pane{position:relative}#gmode{position:absolute;top:10px;right:12px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--code);color:var(--mute);cursor:pointer;user-select:none}#gmode:hover{color:var(--acc)}
#gc{display:block;width:100%;height:100%;cursor:grab}
body.side-off #app{grid-template-columns:1fr}body.side-off #side{display:none}
/* native Mac app: the sidebar is translucent (NSVisualEffectView sits behind the web view) and content reaches under the title bar */
html.mac,html.mac body{background:transparent}
html.mac #main{background:var(--bg)}
html.mac #side{background:transparent}
html.mac #side header{padding-top:40px;-webkit-user-select:none}
html.mac #bar{min-height:52px;-webkit-user-select:none}

#fr{display:none;align-items:center;gap:6px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
#fr.on{display:flex;flex-wrap:wrap}
#fr input{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0;width:170px}
#frc{font-size:12px;color:var(--mute);min-width:64px}
::highlight(find){background:#ffd54a99;color:inherit}
::highlight(findcur){background:#ff9f0a;color:#000}
/* focus mode: just the page, centred, with the caret kept mid-screen */
body.focus #side,body.focus #outline,body.focus #back{display:none}
body.focus #app{grid-template-columns:1fr}
body.focus #bar{opacity:0;transition:opacity .25s}body.focus #bar:hover,body.focus #bar:focus-within{opacity:1}
body.focus #hl,body.focus #ed{padding-bottom:45vh}
#back{border-top:1px solid var(--line);padding:8px 16px;font-size:13px;color:var(--mute);max-height:20%;overflow:auto}
#back a{color:var(--acc);cursor:pointer;margin-right:12px}
#outline{border-top:1px solid var(--line);padding:6px 16px;font-size:13px;color:var(--mute);max-height:14%;overflow:auto;display:none}
#outline a{color:var(--fg);cursor:pointer;margin-right:12px;white-space:nowrap;display:inline-block}#outline a:hover{color:var(--acc)}
#outline a.l2{margin-left:8px}#outline a.l3{margin-left:16px}
#sw{position:fixed;inset:0;background:#0006;display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
#sw>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:min(480px,92vw);overflow:hidden}
#swq{width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);outline:0;background:none}
#swl .item{border-radius:0}
#gf{position:fixed;inset:0;background:#0006;display:none;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:30}

#gf .row{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}#gf .row input[type=text],#gf .row input:not([type]){flex:1;min-width:0}
#gfl{overflow:auto;flex:1}#gfl .m{padding:6px 12px;border-bottom:1px solid var(--line);font-size:13px}#gfl .m label{display:flex;gap:8px;align-items:baseline}#gfl .m small{color:var(--mute);display:block;margin-left:22px;white-space:pre-wrap}#gfl mark{background:rgba(255,200,0,.35);color:inherit}
#gfs{padding:8px 12px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.empty{color:var(--mute);padding:40px;text-align:center}
@media print{#side,#bar,#back,#outline,#fr,#sw,#gf,#status,#gmode,#menu{display:none!important}html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}#main,#pane,#pv{position:static!important;display:block!important;overflow:visible!important;height:auto!important;max-width:none!important;padding:0!important}#pv{font-size:12pt!important;color:#000}#pv a{color:#000;text-decoration:underline}#pv pre,#pv blockquote,#pv table,#pv .callout,#pv .embed{break-inside:avoid}}
.tk-c{color:var(--mute);font-style:italic}.tk-s{color:var(--str)}.tk-n{color:var(--num)}.tk-k{color:var(--acc);font-weight:600}
#ac{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px #0003;min-width:220px;max-width:90%;display:none;z-index:5;overflow:hidden}
#ac .item{border-radius:0}
#main{position:relative}
#menu{display:none}
.trashrow{display:flex;gap:6px;align-items:center}.trashrow span{flex:1;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){
  #app{grid-template-columns:1fr}
  #menu{display:inline-block}
  #side{display:none;position:fixed;inset:0 25% 0 0;z-index:10;box-shadow:0 0 40px #0006}
  body.side-open #side{display:flex}
  #bar{padding:8px 10px;flex-wrap:wrap}
  #hl,#ed,#pv{padding:16px 12px 80px}
}

/* ---- macOS-style refinement layer ---- */
:root{--r:8px}

.item{padding:6px 10px;border-radius:var(--r);transition:background .12s}
.item:hover{background:var(--hover)}

.item.on .snip{color:inherit;opacity:.8}

<body>
<div id="app">
  <aside id="side">
    <header><input id="q" placeholder="Search…" autocomplete="off"><button id="new" title="New note (Ctrl/Cmd+N)" aria-label="New note">+</button><button id="today" title="Today's daily note (Ctrl/Cmd+Shift+T)" aria-label="Today's note">Today</button><button id="theme"></button></header>
    <div id="tags"></div>
    <div id="list"></div>
    <footer id="sf"><button id="sync" title="Sync notes with a git remote" aria-label="Sync">Sync</button><label title="Sync every 2 minutes" style="white-space:nowrap"><input type="checkbox" id="auto"> Auto</label><button id="trash" title="Deleted notes" aria-label="Trash">Trash</button><span id="ss"></span></footer>
  </aside>
  <main id="main">
    <div id="bar"><button id="menu" title="Notes list">☰</button><input id="title" placeholder="Select or create a note" disabled><span id="status"></span><span id="wc" title="Words · characters"></span>
      <button id="pin" title="Pin to top of the list" aria-label="Pin" aria-pressed="false">Pin</button><button id="gr" title="Graph view (Ctrl/Cmd+G)" aria-label="Graph view">Graph</button><button id="tog" title="Edit / preview (Ctrl/Cmd+E)" aria-label="Preview">Preview</button><button id="del" title="Delete" aria-label="Delete note">Delete</button><button id="more" title="More" aria-label="More" aria-haspopup="true">…</button></div>
    <div id="moremenu" role="menu"><button id="exp" role="menuitem" title="Download as a standalone HTML page">Export as HTML</button><button id="pdfb" role="menuitem">Export as PDF / Print…</button><button id="gfb" role="menuitem">Find in all notes…</button></div>
    <div id="fr"><input id="frq" placeholder="Find" autocomplete="off" spellcheck="false"><input id="frr" placeholder="Replace" autocomplete="off" spellcheck="false"><span id="frc"></span>
      <button id="frp" title="Previous (Shift+Enter)">↑</button><button id="frn" title="Next (Enter)">↓</button><button id="frs">Replace</button><button id="fra">All</button><button id="frx" title="Close (Esc)">✕</button></div>
    <div id="pane"><div class="empty"><kbd>Ctrl/Cmd+K</kbd> jump or create · <kbd>Ctrl/Cmd+N</kbd> new note · <kbd>Ctrl/Cmd+E</kbd> preview</div></div>
    <div id="outline"></div>
    <div id="back"></div>
    <div id="ac"></div>
  </main>
</div>
<div id="gf"><div><div class="row"><input id="gfq" placeholder="Find in all notes…" autocomplete="off"><input id="gfr" placeholder="Replace with…" autocomplete="off"></div><div id="gfl"></div><div id="gfs"><span id="gfc"></span><span><button id="gfx">Close</button> <button id="gfa" class="pri">Replace selected</button></span></div></div></div>
<div id="sw"><div><input id="swq" placeholder="Jump to or create a note…" autocomplete="off"><div id="swl"></div></div></div>

<script src="md.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let notes = new Map();   // name -> {text, mtime}
let activeTag = null;
let graphOn = false, gRaf = 0, graphScope = 0;   // graphScope: 0 = all notes, 1/2 = neighbourhood of the open note
let cur = null, preview = false, timer = null, dirty = false;

const api = async (url, opt) => {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
};
const { esc, linkRe, tagsOf } = MD;
const resolve = (t) => { t = t.trim(); if (notes.has(t)) return t;
  const l = t.toLowerCase(); for (const n of notes.keys()) if (n.toLowerCase() === l || n.split('/').pop().toLowerCase() === l) return n; return null; };

async function load() {
  const fresh = await api('/api/notes');
  const keep = dirty && cur ? notes.get(cur) : null;      // never replace text the user typed but hasn't saved yet
  notes = new Map(fresh.map((n) => [n.name, { ...n, base: n.mtime }]));
  if (keep) notes.set(keep.name, keep);
  renderList();
}

const { md } = MD.create({ resolve: (t) => resolve(t), embed: (name, h) => {
  const n = notes.get(name); if (!n) return null;
  const body = MD.frontmatter(n.text).body;
  return h ? MD.section(body, h) : body;
} });

/* ---------- UI ---------- */
let tagsOpen = false;
function renderTags() {
  const counts = new Map();
  for (const n of notes.values()) for (const t of tagsOf(n.text)) counts.set(t, (counts.get(t) || 0) + 1);
  if (activeTag && !counts.has(activeTag)) activeTag = null;
  const all = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 40), cap = tagsOpen ? 40 : 8;
